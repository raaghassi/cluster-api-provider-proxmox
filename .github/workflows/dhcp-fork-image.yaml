name: dhcp-fork-image

# Fork-specific image build that triggers on the dhcp-support branch
# and tags matching v*-dhcp.* (e.g. v0.8.1-dhcp.1). The upstream
# container-image.yaml continues to handle main/release-* and plain
# v* tags; this workflow is additive so an upstream rebase doesn't
# conflict with our customisations.

on:
  push:
    branches:
      - dhcp-support
    tags:
      - 'v*-dhcp.*'
  pull_request:
    branches:
      - dhcp-support

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build dhcp-fork image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate lowercase repository name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ env.REPO }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=dhcp-,format=short

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
